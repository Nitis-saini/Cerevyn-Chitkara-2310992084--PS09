# OPTIONAL and MANUAL: deploys the built app to Azure Static Web Apps.
# It only runs when you start it from the Actions tab, so it never interferes with CI
# and never fails for people who have no Azure account.
# Setup instructions: docs/azure-plan.md. This workflow has NOT been run by the author.
name: Deploy to Azure Static Web Apps (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build

      - name: Deploy dist/ to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
